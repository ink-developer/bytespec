[project]
name = "bytespec"
version = "0.1.0"
description = "Declarative binary serialization and deserialization for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ink-developer", email = "142109011+ink-developer@users.noreply.github.com" }
]
requires-python = ">=3.10"

dependencies = [
    "typing-extensions>=4.16.0",
]

keywords = [
    "binary",
    "serialization",
    "deserialization",
    "codec",
    "protocol",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ink-developer/bytespec"
Repository = "https://github.com/ink-developer/bytespec"
Issues = "https://github.com/ink-developer/bytespec/issues"
Documentation = "https://bytespec.pymax.org"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.13",
]
test = [
    "pytest>=9.1.1",
]
docs = [
    "construct>=2.10.70,<2.11",
    "furo>=2025.12.19",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7,<0.8",
    "sphinx-intl>=2.4.0",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.11" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RET",
    "RUF",
    "ARG",
    "PT",
    "S",
    "PLE",
    "PLW",
    "PERF",
    "PIE",
]

ignore = [
    "RUF002",
    "RUF003",
    "PT006",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG",
    "S101",
    "PLR2004",
]

"docs/conf.py" = [
    "ARG001",
]

"docs/check.py" = [
    "E402",
    "T201",
]
